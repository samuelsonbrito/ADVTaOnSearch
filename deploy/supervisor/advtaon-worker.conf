; Workers da fila (monitoramento e exportações). Ajuste os caminhos e o usuário.
; Instalação: copie para /etc/supervisor/conf.d/ e rode
;   sudo supervisorctl reread && sudo supervisorctl update
[program:advtaon-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/advtaon/artisan queue:work redis --sleep=3 --tries=3 --max-time=3600 --timeout=650
directory=/var/www/advtaon
user=www-data
numprocs=2
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=700
redirect_stderr=true
stdout_logfile=/var/www/advtaon/storage/logs/worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
